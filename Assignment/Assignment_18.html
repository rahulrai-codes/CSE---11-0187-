<!DOCTYPE html>
<html>
<head>
    <title>Assignment 18</title>
</head>
<body>
<header style="background: #0a1f7a; color: white; text-align: center; padding: 15px;">
    <h1>ABC College Admission 2026</h1>
</header>

<main>
    <section>
      <h2>Courses and Fees</h2>
      <table border="1">
        <caption>Available Courses</caption>
        <thead>
          <tr>
            <th>Course</th>
            <th>Seats</th>
            <th>Fees</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>B.Tech CSE</td>
            <td>120</td>
            <td>₹90,000</td>
          </tr>
          <tr>
            <td>BCA</td>
            <td>60</td>
            <td>₹45,000</td>
          </tr>
        </tbody>
      </table>
    </section>

    <form action="#" method="post">
      <fieldset>
        <legend>Application Form</legend>

        <p>
          <label for="name">Name:</label><br>
          <input type="text" id="name" name="name" required>
        </p>

        <p>
          <label for="email">Email:</label><br>
          <input type="email" id="email" name="email" required>
        </p>

        <p>
          <label for="course">Course:</label><br>
          <select id="course" name="course">
            <option>B.Tech CSE</option>
            <option>BCA</option>
          </select>
        </p>

        <p>
          <label for="statement">Statement:</label><br>
          <textarea id="statement" name="statement" rows="4" cols="40"></textarea>
        </p>

        <button type="submit">Apply</button>
      </fieldset>
    </form>
</main>

<footer style="background: #0a1f7a; color: white; text-align: center; padding: 8px;">
    <p>&copy; 2026 ABC College</p>
</footer>
</body>
</html>
